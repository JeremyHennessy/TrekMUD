name: Asteria CC0 ribbed pilot-seat asset intake - Blender physical preview NO DEPLOY
on:
  push:
    branches: [experiment/asteria-stage28-integrated-command-ceiling-sprint]
    paths:
      - .github/workflows/validate-asteria-cc0-ribbed-seat-intake.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asteria-ribbed-seat-intake
  cancel-in-progress: false
jobs:
  inspected-real-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve approved source and game
        run: |
          set -euo pipefail
          test "$(git hash-object ui/3d-preview-v3/index.html)" = 74a154ae62bccb0c16d03c2ecf791a64ab19ce81
          python scripts/validate_campaign.py
          python scripts/validate_asteria.py
      - name: Acquire genuine CC0 seat model without modifying preview routes
        run: |
          set -euo pipefail
          mkdir -p _seat_intake
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
            'https://files.innerscene.com/library/ridge-aluminum-ribbed-task-chair-25fb21c3/e1c956fbb62fe0f1f92b/aluminum-ribbed-task-chair.glb' \
            --output _seat_intake/source.glb
          python - <<'PY'
          from pathlib import Path
          import hashlib,struct,json
          p=Path('_seat_intake/source.glb')
          raw=p.read_bytes()
          assert raw[:4]==b'glTF' and len(raw)==struct.unpack_from('<I',raw,8)[0]
          assert 200000<len(raw)<20000000
          receipt={
            'asset':'Ridge - Aluminum Ribbed Task Chair',
            'source':'https://www.innerscene.com/tools/library/3d-parts/ridge-aluminum-ribbed-task-chair-25fb21c3',
            'license_claim':'CC0 1.0; original Innerscene, site description; confirm rights at release',
            'original_sha256':hashlib.sha256(raw).hexdigest(),
            'bytes':len(raw),
            'purpose':'isolated asset evaluation ONLY; not Asteria art or deploy',
          }
          Path('_seat_intake/intake.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('GLB_MAGIC_LENGTH_SHA256_PASS',json.dumps(receipt))
          PY
      - name: Render real imported mesh from front rear and oblique with Cycles
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          cat > /tmp/asteria_cc0_preview.py <<'PY'
          import bpy,json,math
          from pathlib import Path
          from mathutils import Vector
          root=Path('_seat_intake')
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          bpy.ops.import_scene.gltf(filepath=str(root/'source.glb'))
          originals=[o for o in bpy.context.scene.objects if o.type=='MESH']
          assert originals, 'No actual glTF meshes'
          points=[o.matrix_world @ Vector(v) for o in originals for v in o.bound_box]
          low=Vector(tuple(min(v[i] for v in points) for i in range(3)))
          high=Vector(tuple(max(v[i] for v in points) for i in range(3)))
          center=(low+high)/2
          span=max(high-low)
          assert 0.3<span<10, ('unexpected metre-scale bounding',span)
          triangles=sum(sum(len(p.vertices)-2 for p in o.data.polygons) for o in originals)
          assert 1000<triangles<500000, ('unexpected mesh complexity',triangles)
          meshes=[]
          for o in originals:
              meshes.append({'name':o.name,'triangles':sum(len(p.vertices)-2 for p in o.data.polygons),
                 'uv_layers':[u.name for u in o.data.uv_layers],
                 'materials':[m.name if m else None for m in o.data.materials]})
          receipt=json.loads((root/'intake.json').read_text())
          receipt.update({'triangles':triangles,'meshes':meshes,'dimensions_xyz_m':[round(float(x),4) for x in high-low]})
          (root/'inspection.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('IMPORTED_REAL_GLTF',json.dumps({'triangles':triangles,'parts':len(meshes),'dimensions':receipt['dimensions_xyz_m']}))
          # Lighting and floor exist only in inspection renders, never exported.
          bpy.ops.mesh.primitive_plane_add(size=200,location=(center.x,center.y,low.z-0.016))
          plane=bpy.context.object
          ground=bpy.data.materials.new('inspection_matte_neutral')
          ground.diffuse_color=(0.28,0.31,0.34,1)
          plane.data.materials.append(ground)
          world=bpy.context.scene.world or bpy.data.worlds.new('inspection_world')
          bpy.context.scene.world=world
          world.use_nodes=True
          bg=world.node_tree.nodes.get('Background')
          bg.inputs['Color'].default_value=(0.28,0.32,0.37,1)
          bg.inputs['Strength'].default_value=0.65
          for name,vec,watts,sz in (
            ('soft_key',(2.1,-2.5,3.9),650,3.2),
            ('fill',(-3.1,1.8,2.4),450,3.8),
            ('rim',(0.3,2.4,3.2),440,2.8)):
              light=bpy.data.lights.new(name,'AREA')
              light.energy=watts
              light.shape='DISK'
              light.size=sz
              obj=bpy.data.objects.new(name,light)
              bpy.context.scene.collection.objects.link(obj)
              obj.location=center+Vector(vec)*span*0.62
              obj.rotation_euler=(center-obj.location).to_track_quat('-Z','Y').to_euler()
          camera_data=bpy.data.cameras.new('asset_inspection_ortho')
          camera=bpy.data.objects.new('asset_inspection_ortho',camera_data)
          bpy.context.scene.collection.objects.link(camera)
          bpy.context.scene.camera=camera
          camera_data.type='ORTHO'
          camera_data.ortho_scale=span*1.6
          scene=bpy.context.scene
          scene.render.engine='CYCLES'
          scene.cycles.samples=20
          scene.render.resolution_x=960
          scene.render.resolution_y=720
          scene.render.resolution_percentage=100
          scene.render.image_settings.file_format='PNG'
          scene.view_settings.view_transform='Standard'
          scene.view_settings.look='Medium High Contrast'
          for name,vec in (
            ('front',(0,-2.5,1.1)),('rear',(0,2.5,1.1)),('oblique',(2.3,-2.3,1.45))):
              camera.location=center+Vector(vec)*span*.8
              camera.rotation_euler=(center-camera.location).to_track_quat('-Z','Y').to_euler()
              scene.render.filepath=str(root/('actual-blender-'+name+'.png'))
              bpy.ops.render.render(write_still=True)
          print('REAL_BLENDER_THREE_ANGLES_COMPLETE')
          PY
          blender --background --factory-startup --python /tmp/asteria_cc0_preview.py
          test -s _seat_intake/actual-blender-front.png
          test -s _seat_intake/actual-blender-rear.png
          test -s _seat_intake/actual-blender-oblique.png
          test -s _seat_intake/inspection.json
      - name: Upload source provenance topology and real images (still NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: asteria-cc0-ribbed-seat-asset-physical-preview
          path: _seat_intake/
          retention-days: 30
          if-no-files-found: error
