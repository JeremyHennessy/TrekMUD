name: Asteria Stage37 sculpted upholstered twin pilot seats — actual Chromium art-first (NO DEPLOY)
on:
  push:
    branches: [experiment/asteria-stage28-integrated-command-ceiling-sprint]
    paths:
      - scripts/asteria_stage37_pilot_hero.py
      - scripts/asteria_stage37_v3_filter.py
      - scripts/asteria_stage37_envelope_splice.py
      - scripts/asteria_stage37_pilot_source_audit.py
      - scripts/test_asteria_stage37_art_browser.py
      - .github/workflows/validate-asteria-stage37-pilot-art.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: asteria-stage37-pilot-art-candidate
  cancel-in-progress: false
jobs:
  pilot-art-first:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-sculpt]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve hash-pinned successful full-scene baseline, never a production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('baselines/asteria-fast-art-base.json').read_text())
          assert c['runId']>0 and len(c['commitSHA'])==40
          assert c['workflow']=='Asteria Stage28 full structural ceiling macro - real Cycles Chromium A/B NO DEPLOY'
          Path('/tmp/asteria36-base-run').write_text(str(c['runId']))
          Path('/tmp/asteria36-base-sha').write_text(c['commitSHA'])
          PY
          BASE_RUN="$(cat /tmp/asteria36-base-run)"
          BASE_SHA="$(cat /tmp/asteria36-base-sha)"
          gh api "repos/JeremyHennessy/TrekMUD/actions/runs/$BASE_RUN" \
            --jq '{sha:.head_sha,conclusion:.conclusion,name:.name}' > /tmp/asteria36-producer.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/asteria36-producer.json').read_text())
          assert a['sha']==Path('/tmp/asteria36-base-sha').read_text()
          assert a['conclusion']=='success'
          assert a['name']=='Asteria Stage28 full structural ceiling macro - real Cycles Chromium A/B NO DEPLOY'
          PY
          gh run download "$BASE_RUN" --repo JeremyHennessy/TrekMUD \
            --name asteria-fast-art-base --dir _pilot_base
          python scripts/asteria_fast_art_snapshot.py verify \
            --root _pilot_base --base-sha "$BASE_SHA"
      - name: Exact-source V3 pilot mask and artistically coherent twin pilot-seat replacement
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0 playwright==1.56.0
          python -m py_compile scripts/asteria_stage37_pilot_hero.py \
            scripts/asteria_stage37_v3_filter.py scripts/asteria_stage37_envelope_splice.py \
            scripts/test_asteria_stage37_art_browser.py
          mkdir -p _pilot_site/control _pilot_site/candidate _pilot_evidence
          cp -a _pilot_base/site/. _pilot_site/control/
          cp -a _pilot_base/site/. _pilot_site/candidate/
          # Cheap geometry check first; no full Cycles pipeline for art NO-GO.
          python scripts/asteria_stage37_pilot_hero.py > _pilot_evidence/stage37-geometry-preflight.json
          ASTERIA_V5_SOURCE_DIR=_pilot_original_capture python scripts/extract_asteria_v3_for_v5.py
          python scripts/asteria_source_underconsole_audit.py \
            --output _pilot_evidence/underconsole-original-provenance.json
          python scripts/asteria_stage33_v3_filter.py \
            --site _pilot_base/site --capture _pilot_original_capture \
            --proof _pilot_evidence/underconsole-original-provenance.json \
            --out _pilot_site/candidate
          mv _pilot_site/candidate/stage33-source-exclusion-proof.json _pilot_evidence/
          python scripts/asteria_stage36_pilot_source_audit.py \
            --output _pilot_evidence/stage37-original-pilot-provenance.json
          python scripts/asteria_stage37_v3_filter.py \
            --site _pilot_site/candidate --capture _pilot_original_capture \
            --proof _pilot_evidence/stage37-original-pilot-provenance.json \
            --receipt _pilot_evidence/stage37-exact-v3-source-mask.json
          python scripts/asteria_stage37_envelope_splice.py \
            --control _pilot_site/control --candidate _pilot_site/candidate \
            --proof _pilot_evidence/stage37-envelope-splice.json
          # Existing Stage33 command geometry remains the immediately preceding
          # untouched candidate; pilot seat replacement uses ENVELOPE not command.
          blender -b -t 4 --python-exit-code 1 --python scripts/asteria_command_blender.py -- \
            --materials _pilot_base/maps --out _pilot_command --samples 20 \
            --no-render --bake-ao --correct-screen-uv --stage33-command-island
          test -s _pilot_command/asteria-command-set-candidate.glb
          python scripts/asteria_stage33_glb_uv1_verify.py \
            --glb _pilot_command/asteria-command-set-candidate.glb \
            --report _pilot_evidence/stage33-export-uv1-proof.json
          cp _pilot_command/asteria-command-set-candidate.glb \
            _pilot_site/candidate/models/asteria-command-set-candidate.glb
      - name: Actual identical-camera browser desktop 1280 and mobile 390, all original UI
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium)" \
            python scripts/test_asteria_stage37_art_browser.py \
              --site _pilot_site --out _pilot_evidence \
              --base-sha "$(cat /tmp/asteria36-base-sha)"
      - name: Preserve original/candidate GLBs, source receipts, and real rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-stage37-twin-pilot-actual-browser-a-b
          path: |
            _pilot_evidence/*.png
            _pilot_evidence/*.jpg
            _pilot_evidence/*.json
            _pilot_site/candidate/models/asteria-v3-restored-pbr.glb
            _pilot_site/candidate/models/asteria-realistic-architectural-envelope-08.glb
            _pilot_command/command-report.json
          if-no-files-found: ignore
          retention-days: 30
