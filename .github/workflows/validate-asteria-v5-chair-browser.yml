name: Asteria V5 chair-winding browser acceptance candidate

on:
  workflow_dispatch:
  pull_request:
    branches: ['feature/asteria-v5-faithful-pbr']
    paths:
      - 'scripts/build_asteria_v5_assets.py'
      - '.github/workflows/validate-asteria-v5-chair-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate player-safe campaign and preserve V3 comparison
        run: python scripts/validate_player_console.py --keep _site
      - name: Install pinned model and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1 playwright==1.56.0
          npm ci --prefix ui/3d-preview-v5 --no-audit --no-fund
      - name: Recover frozen V3 mesh, build opt-in V5 fix and independent viewer
        run: |
          python scripts/extract_asteria_v3_for_v5.py
          mkdir -p _site/3d-preview-v5/models
          ASTERIA_V5_CHAIR_WINDING_REPAIR=1 \
            ASTERIA_V5_OUT_DIR="$PWD/_site/3d-preview-v5/models" \
            python scripts/build_asteria_v5_assets.py
          npm run build --prefix ui/3d-preview-v5
          cp ui/3d-preview-v5/src/index.html _site/3d-preview-v5/index.html
          cp ui/3d-preview-v5/dist/app.js _site/3d-preview-v5/app.js
          python scripts/verify_asteria_v5.py _site/3d-preview-v5
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('_site/3d-preview-v5/models/manifest.json').read_text())
          assert j['chair_winding_faces_reordered']==5136,j
          assert j['triangles']==106988,j
          print('Validated exact isolated chair winding correction:',j['chair_winding_faces_reordered'])
          PY
      - name: Exercise actual WebGL scene, walking and matched V3 comparisons
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)" \
            python scripts/test_asteria_v5_browser.py _site "$RUNNER_TEMP/asteria-v5-chair-winding-browser"
      - name: Archive actual browser screenshot and movement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-v5-chair-repair-browser-review
          path: |
            ${{ runner.temp }}/asteria-v5-chair-winding-browser/**
            _site/3d-preview-v5/models/manifest.json
          if-no-files-found: ignore
          retention-days: 7
