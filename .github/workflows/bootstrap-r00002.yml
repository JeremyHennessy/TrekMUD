name: Bootstrap RNG r00002

on:
  push:
    branches:
      - initialize-rng-r00002
    paths:
      - scripts/initialize_rng_commitment.py
      - .github/workflows/bootstrap-r00002.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-r00002
  cancel-in-progress: false

jobs:
  rng:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initialize-rng-r00002
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile initializer
        run: python -m py_compile scripts/initialize_rng_commitment.py

      - name: Initialize public commitment and checkpoint
        run: |
          if [ -f campaign/checkpoints/r00002.json ]; then
            echo "r00002 already exists"
          else
            python scripts/initialize_rng_commitment.py --commitment 7fcb8273a412f1365dc155b28c48e96108335a0419768f11ec1fd13b08d3b513
            python scripts/create_checkpoint.py --summary "Initialize deterministic RNG commitment"
          fi

      - name: Verify zero-time zero-story checkpoint
        run: |
          python scripts/validate_campaign.py
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("campaign/state.json").read_text())
          rng = json.loads(Path("campaign/rng.json").read_text())
          cp = json.loads(Path("campaign/checkpoints/r00002.json").read_text())

          assert state["revision"] == 2
          assert state["status"] == "READY_TO_START"
          assert state["currentTime"]["shipTime"] == "12:17"
          assert state["currentTime"]["stardate"] == 49317.4
          assert state["player"]["locationId"] == "MER-D09-TR-02"

          assert rng["status"] == "INITIALIZED"
          assert rng["counter"] == 0
          assert rng["publicCommitment"] == "7fcb8273a412f1365dc155b28c48e96108335a0419768f11ec1fd13b08d3b513"

          assert cp["checkpointId"] == "r00002"
          assert cp["previousCheckpointId"] == "r00001"
          assert cp["revision"] == 2
          assert cp["rulesVersion"] == "1.1"
          assert cp["validation"]["rngCounter"] == 0
          assert cp["validation"]["valid"] is True

          print("public r00002 RNG initialization verified")
          PY

      - name: Commit generated r00002
        run: |
          if git diff --quiet -- campaign && [ -z "$(git status --porcelain -- campaign)" ]; then
            echo "No campaign changes."
            exit 0
          fi
          git config user.name "trekmud-rng-bot"
          git config user.email "actions@users.noreply.github.com"
          git add campaign
          git commit -m "checkpoint: r00002 initialize deterministic RNG [skip ci]"
          git push origin HEAD:initialize-rng-r00002
