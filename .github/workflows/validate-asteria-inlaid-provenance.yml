name: Asteria exact wall and ceiling draw-call source provenance

on:
  push:
    branches: [experiment/asteria-inlaid-bay-02]
    paths:
      - scripts/extract_asteria_v3_for_v5.py
      - .github/workflows/validate-asteria-inlaid-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure-original-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert immutable main game and V3 source
        run: |
          python scripts/validate_campaign.py
          python scripts/validate_asteria.py
          test "$(git hash-object ui/3d-preview-v3/index.html)" = 74a154ae62bccb0c16d03c2ecf791a64ab19ce81
          python -m py_compile scripts/extract_asteria_v3_for_v5.py
      - name: Install exact already tested face-capture dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 playwright==1.56.0
          command -v google-chrome || command -v chromium
      - name: Instrument original V3 draw calls in memory only
        run: |
          ASTERIA_V3_CAPTURE_CAPTAIN_CHAIR=1 \
            ASTERIA_V3_CAPTURE_COMMAND_SECTION=1 \
            ASTERIA_V3_CAPTURE_INLAID_BAY=1 \
            python scripts/extract_asteria_v3_for_v5.py
      - name: Independently check original topology and disjoint source spans
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np
          p=Path('_v5_mesh_capture')
          report=json.loads((p/'inlaid-bay-source-spans.json').read_text())
          chair=json.loads((p/'captain-chair-source-span.json').read_text())
          cmd=json.loads((p/'command-section-source-spans.json').read_text())
          assert report['sourceV3Blob']==chair['sourceV3Blob']==cmd['sourceV3Blob']=='74a154ae62bccb0c16d03c2ecf791a64ab19ce81'
          assert report['totalFaces']==106988
          faces=report['ranges']
          assert len(faces)==3
          by_name={f['name']:f for f in faces}
          assert set(by_name)=={'wallBayDecor24','ceilingWedge36','ceilingWedge37'}
          assert by_name['ceilingWedge36']['faces']==2
          assert by_name['ceilingWedge37']['faces']==2
          assert by_name['wallBayDecor24']['faces']>15
          assert sum(f['faces'] for f in faces)==report['removedFaces']
          assert report['structuralWallSubstrateRetained'] is True
          assert report['neighborRibsAndConsolesRetained'] is True
          kept=np.ones(106988,dtype=bool)
          for span in [{'start':chair['firstFaceIncluded'],'end':chair['lastFaceExcluded']},*cmd['ranges'],*faces]:
            a,b=span['start'],span['end']
            assert 0<=a<b<=106988 and kept[a:b].all(),span
            kept[a:b]=False
          assert kept.sum()==106988-chair['captainSeatFaces']-cmd['commandFaces']-report['removedFaces']
          assert np.load(p/'positions.npy').size==106988*9
          print('EXACT_FROZEN_BAY_RANGES_VERIFIED',json.dumps(report))
          print('FINAL_INLAID_ROOM_FACE_COUNT',int(kept.sum()))
          PY
      - name: Preserve face-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-inlaid-v3-boundary-provenance
          path: |
            _v5_mesh_capture/inlaid-bay-source-spans.json
            _v5_mesh_capture/captain-chair-source-span.json
            _v5_mesh_capture/command-section-source-spans.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Archive exact successful draw-call evidence in experiment branch
        if: success()
        run: |
          mkdir -p docs/asteria-inlaid-bay-source
          cp _v5_mesh_capture/inlaid-bay-source-spans.json docs/asteria-inlaid-bay-source/face-provenance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/asteria-inlaid-bay-source/face-provenance.json
          git diff --cached --quiet && exit 0
          git commit -m 'QA-only: archive measured V3 wall and ceiling source boundaries'
          git push origin HEAD:experiment/asteria-inlaid-bay-02
