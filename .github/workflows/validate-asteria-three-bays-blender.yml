name: Asteria Stage04 three source-fit rib bays Cycles and GLB review

on:
  push:
    branches: [experiment/asteria-three-rib-bays-04]
    paths:
      - scripts/asteria_three_rib_bays_blender.py
      - .github/workflows/validate-asteria-three-bays-blender.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asteria-three-bays-blender-stage04
  cancel-in-progress: false

jobs:
  measured-three-bays:
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect campaign, original frozen V3 and Blender authoring
        run: |
          python scripts/validate_campaign.py
          python scripts/validate_asteria.py
          test "$(git hash-object ui/3d-preview-v3/index.html)" = 74a154ae62bccb0c16d03c2ecf791a64ab19ce81
          python -m py_compile scripts/asteria_three_rib_bays_blender.py \
            scripts/extract_asteria_v3_for_v5.py \
            scripts/asteria_rib_fin_maps.py scripts/build_asteria_v5_assets.py
      - name: Install same pinned Blender and PBR mesh pipeline
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1 playwright==1.56.0
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Capture exact frozen three-wall geometry without editing original source
        run: |
          ASTERIA_V3_CAPTURE_CAPTAIN_CHAIR=1 \
            ASTERIA_V3_CAPTURE_COMMAND_SECTION=1 \
            ASTERIA_V3_CAPTURE_INLAID_BAY=1 \
            ASTERIA_V3_CAPTURE_THREE_RIB_BAYS=1 \
            python scripts/extract_asteria_v3_for_v5.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_v5_mesh_capture/three-rib-bays-source-spans.json').read_text())
          assert r['selectedWallDecorK']==[22,23,24]
          assert [x['faces'] for x in r['ranges']]==[58,58,58]
          assert r['removedFaces']==174
          assert r['ceilingWedgesRetained']
          print('SOURCE_FROZEN_THREE_BAYS_PROVEN',r['ranges'])
          PY
      - name: Create original and shared PBR material images
        run: |
          python scripts/asteria_command_pbr_maps.py \
            --out _asteria_command_maps --v3-atlas _v5_mesh_capture/atlas.png
          python scripts/asteria_rib_fin_maps.py --out _asteria_rib_fin_maps
      - name: Render actual three-bay original-pitch Cycles screenshots
        run: |
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_three_rib_bays_blender.py -- \
            --out _asteria_three_bays_model \
            --materials _asteria_rib_fin_maps \
            --command-materials _asteria_command_maps \
            --source-report _v5_mesh_capture/three-rib-bays-source-spans.json \
            --samples 24 --resolution 960 640
      - name: Independently verify three-bay GLB, textures and real image pixels
        run: |
          python - <<'PY'
          import json,struct
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import trimesh
          root=Path('_asteria_three_bays_model')
          report=json.loads((root/'rib-fin-report.json').read_text())
          assert report['assetId']=='ASTERIA_THREE_ORIGINAL_RIB_FIN_BAYS_04'
          assert report['frozenSource']=='74a154ae62bccb0c16d03c2ecf791a64ab19ce81'
          assert report['selectedOriginalWallModules']==[22,23,24]
          assert report['removedOriginalWallDecorFaces']==174
          assert report['originalCeilingTrianglesRemoved']==0
          assert report['retainedOriginalCeilingWedgeFaces']==4
          assert report['preservedOriginalWallSubstrate']
          assert report['originalAdjacentStructuralRibsUnmodified']
          assert report['noOpaqueDoorPanel'] and not report['visualApproval']
          assert report['numberOfCurvedManufacturedFins']==15
          assert report['numberOfSeparateAcousticLanes']==12
          assert report['meshObjects']==105
          blend=root/'asteria-three-original-pitch-rib-bays-04.blend'
          glb=root/'asteria-three-original-pitch-rib-bays-04.glb'
          assert blend.stat().st_size>100000 and glb.stat().st_size>150000
          loaded=trimesh.load(glb,force='scene',process=False)
          triangles=sum(len(x.faces) for x in loaded.geometry.values())
          assert triangles==4366*3==13098,triangles
          bounds=loaded.bounds
          assert 3.8<bounds[0][0]<5.2,bounds
          assert 5.3<bounds[1][0]<6.4,bounds
          assert .7<bounds[0][1]<bounds[1][1]<3.1,bounds
          assert -5.2<bounds[0][2]<-4.2,bounds
          assert -4.2<bounds[1][2]<-3.0,bounds
          raw=glb.read_bytes()
          n=struct.unpack_from('<I',raw,12)[0]
          gltf=json.loads(raw[20:20+n])
          assert len(gltf['images'])==15,len(gltf['images'])
          assert any(m.get('normalTexture') for m in gltf['materials'])
          assert report['renderedViews']==['grazing','front','detail']
          stats={}
          for view in report['renderedViews']:
              img=np.asarray(Image.open(root/f'asteria-three-rib-fin-{view}.png').convert('RGB'))
              assert img.shape==(640,960,3),view
              spread=float(img.std(axis=(0,1)).mean())
              assert spread>12,(view,spread)
              stats[view]=round(spread,3)
          proof={'originalSourceSha':report['frozenSource'],
                 'removedWallTriangles':174,'ceilingTrianglesRemoved':0,
                 'replacementTriangles':triangles,'blenderMeshes':105,
                 'PBRImages':len(gltf['images']),
                 'bounds':bounds.tolist(),'realCyclesPixelVariation':stats,
                 'viewerOrCampaignChanged':False,'photoRealismUnproven':True}
          (root/'technical-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('THREE_BAY_INDEPENDENT_CYCLES_PASS',json.dumps(proof))
          PY
      - name: Preserve source BLEND, GLB and actual Cycles image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-three-bay-stage04-Cycles
          path: |
            _asteria_three_bays_model/*.blend
            _asteria_three_bays_model/*.glb
            _asteria_three_bays_model/*.png
            _asteria_three_bays_model/*.json
            _v5_mesh_capture/three-rib-bays-source-spans.json
            _asteria_rib_fin_maps/material-provenance.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive tested real Cycles screenshots to experimental branch only
        if: success()
        run: |
          set -euo pipefail
          mkdir -p docs/asteria-three-bays-stage04-cycles
          cp _asteria_three_bays_model/asteria-three-rib-fin-*.png docs/asteria-three-bays-stage04-cycles/
          cp _asteria_three_bays_model/*.json docs/asteria-three-bays-stage04-cycles/
          cp _v5_mesh_capture/three-rib-bays-source-spans.json \
             docs/asteria-three-bays-stage04-cycles/original-source-ranges.json
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('docs/asteria-three-bays-stage04-cycles')
          output=Image.new('RGB',(960,3*680),(22,22,30))
          for i,view in enumerate(('grazing','front','detail')):
              output.paste(Image.open(root/f'asteria-three-rib-fin-{view}.png').convert('RGB'),
                           (0,i*680))
              ImageDraw.Draw(output).text((14,i*680+648),view,fill=(245,245,245))
          output.save(root/'actual-three-bay-cycles-sheet.jpg',quality=88,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/asteria-three-bays-stage04-cycles/
          git diff --cached --quiet && exit 0
          git commit -m 'QA evidence: source-measured Stage04 three-bay actual Cycles images'
          git push origin HEAD:experiment/asteria-three-rib-bays-04
