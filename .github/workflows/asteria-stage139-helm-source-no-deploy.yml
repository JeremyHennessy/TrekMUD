name: "Asteria Stage139 independent CC0 helm SOURCE assessment — NO DEPLOY"
on:
  push:
    branches:
      - experiment/asteria-stage28-integrated-command-ceiling-sprint
    paths:
      - .github/workflows/asteria-stage139-helm-source-no-deploy.yml

permissions:
  contents: read

jobs:
  independent-helm-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install isolated source-preview dependencies
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "trimesh==4.9.0" "matplotlib==3.10.7" "Pillow==11.1.0"
      - name: Retrieve and inspect genuine upstream GLB only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, struct, urllib.request, urllib.parse, traceback
          from datetime import datetime, timezone
          import numpy as np
          import trimesh
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from matplotlib.collections import PolyCollection

          out=pathlib.Path('helm139-source-only')
          out.mkdir(exist_ok=True)
          asset='https://cdn.3dassets.dev/assets/36478/v1/model.glb'
          page='https://3dassets.dev/assets/submarine-interior-and-control-room-helm-station-with--5041df91'
          licence='https://creativecommons.org/publicdomain/zero/1.0/'
          receipt={
            'evaluation':'ISOLATED_EXTERNAL_SOURCE_ONLY',
            'status':'SOURCE_UNVERIFIED',
            'source':asset,'sourcePage':page,'reportedLicence':'CC0 1.0 Universal',
            'licenceReference':licence,'reportedAIAuthorship':'Claude Opus 5',
            'reportedDimensionsM':[1.7,1.42,0.792],
            'reportedTriangles':11592,
            'preservedAsteriaScene':True,'productionChanged':False,
            'sourceFitted':False,'artVerdict':'NOT_ASSESSED',
            'releaseAuthorized':False,'integrationAuthorized':False,
            'statedPortTargetBoundsM':[[-1.723,0.266,0.140],[-0.812,1.105,1.042]],
            'stage138PriorVerdict':'ART_NO_GO'
          }
          def get(url, limit=10000000):
            parts=urllib.parse.urlsplit(url)
            assert parts.scheme=='https' and parts.hostname in {'3dassets.dev','cdn.3dassets.dev'}
            req=urllib.request.Request(url,headers={'User-Agent':'Asteria-source-licence-assessment/1.0'})
            with urllib.request.urlopen(req,timeout=35) as f:
              assert f.status==200, ('HTTP',f.status)
              assert int(f.headers.get('Content-Length','0') or 0)<=limit, 'Oversize upstream source'
              data=f.read(limit+1)
              assert urllib.parse.urlsplit(f.geturl()).hostname in {'3dassets.dev','cdn.3dassets.dev'}, 'Source redirected away'
            assert 0<len(data)<=limit,'Invalid source size'
            return data
          try:
            html=get(page,1500000)
            text=html.decode('utf-8','replace')
            assert 'CC0 1.0 Universal' in text, 'Licence label missing at provider'
            assert asset in text, 'Exact immutable version URL not attested by provider page'
            receipt['licencePageSha256']=hashlib.sha256(html).hexdigest()
            receipt['sourcePageIncludesCC0AndExactModelURL']=True
            raw=get(asset,8000000)
            assert raw[:4]==b'glTF' and len(raw)>200,'Not a binary glTF'
            magic,version,declared=struct.unpack_from('<III',raw,0)
            assert version==2 and declared==len(raw)
            jsonlen,kind=struct.unpack_from('<I4s',raw,12)
            assert kind==b'JSON' and 0<jsonlen<3000000
            doc=json.loads(raw[20:20+jsonlen])
            assert doc.get('asset',{}).get('version')=='2.0'
            assert 'meshes' in doc and 'nodes' in doc and 'materials' in doc
            img_count=len(doc.get('images',[]))
            material_count=len(doc.get('materials',[]))
            extensions=doc.get('extensionsUsed',[])
            if 'KHR_draco_mesh_compression' in extensions or 'EXT_meshopt_compression' in extensions:
              raise RuntimeError('Source requires an unsupported decoder')
            source=out/'cc0_submarine_helm_authentic_v1_SOURCE_NOT_INSTALLED.glb'
            source.write_bytes(raw)
            mesh_records=[{'name':m.get('name',''),
               'primitives':len(m.get('primitives',[])),
               'triangles':sum(doc['accessors'][p['indices']]['count']//3
                               for p in m.get('primitives',[]) if 'indices' in p)}
               for m in doc['meshes']]
            node_records=[{'name':n.get('name',''),'mesh':n.get('mesh')}
                          for n in doc.get('nodes',[]) if 'mesh' in n]
            receipt.update(status='SOURCE_DOWNLOADED_AND_GLTF_STRUCTURALLY_VALID',
              upstreamSha256=hashlib.sha256(raw).hexdigest(),upstreamBytes=len(raw),
              gltfExtensionsUsed=extensions,embeddedImageCount=img_count,
              materials=material_count,meshCount=len(mesh_records),nodeMeshCount=len(node_records),
              meshRecords=mesh_records[:100],nodeMeshRecords=node_records[:100],
              upstreamGLBDeclarationVerified=True)
            scene=trimesh.load(str(source),force='scene',process=False)
            assert isinstance(scene,trimesh.Scene) and len(scene.geometry)>0
            geom=scene.dump(concatenate=True)
            assert len(geom.faces)>1000
            bounds=geom.bounds
            receipt.update(triangleCountLoaded=int(len(geom.faces)),
              loadedAABB=bounds.tolist(),loadedDimensions=(bounds[1]-bounds[0]).tolist(),
              sceneMeshCount=len(scene.geometry))
            (out/'source_scene_graph.txt').write_text(scene.graph.to_edgelist().__repr__())
            # True source orthographic silhouette from actual triangle geometry;
            # not a kitbash and not a claim of in-game framing or ART PASS.
            v=geom.vertices
            f=geom.faces
            if len(f)>8000:f=f[np.linspace(0,len(f)-1,8000).astype(int)]
            tri=v[f]
            d=(bounds[1]-bounds[0]).max()
            c=(bounds[0]+bounds[1])/2
            axes=[
              ('operator +Z',np.array([0.,0.,1.]),np.array([1.,0.,0.]),np.array([0.,1.,0.])),
              ('starboard +X',np.array([1.,0.,0.]),np.array([0.,0.,-1.]),np.array([0.,1.,0.])),
              ('oblique +X +Z',np.array([.65,.2,.75]),np.array([.75,0.,-.65]),np.array([0.,1.,0.])),
            ]
            fig,panels=plt.subplots(1,3,figsize=(15,6),facecolor='#181923')
            for ax,(name,front,right,up) in zip(panels,axes):
              front=front/np.linalg.norm(front)
              right=right/np.linalg.norm(right)
              up=up-front*np.dot(up,front)-right*np.dot(up,right)
              up=up/np.linalg.norm(up)
              q=tri-c
              x=q@right;y=q@up;z=q@front
              normal=np.cross(q[:,1,:]-q[:,0,:],q[:,2,:]-q[:,0,:])
              nl=normal/(np.linalg.norm(normal,axis=1,keepdims=True)+1e-9)
              light=np.array([.5,.8,.3]);light/=np.linalg.norm(light)
              intensity=np.clip(.30+.65*np.abs(nl@light),.15,.98)
              rgba=np.stack([intensity*.89,intensity*.93,intensity,
                             np.ones(len(intensity))],axis=1)
              order=np.argsort(z.mean(axis=1))
              ax.add_collection(PolyCollection(np.stack([x,y],axis=-1)[order],
                facecolors=rgba[order],edgecolors='none'))
              ax.set_xlim(-d*.75,d*.75);ax.set_ylim(-d*.7,d*.7)
              ax.set_aspect('equal');ax.set_facecolor('#242733')
              ax.set_title(name,color='#ffffff',fontsize=15)
              ax.tick_params(labelcolor='#d4d4d4',colors='#555555')
            fig.suptitle('Independent CC0 SOURCE geometry inspection — NOT Asteria / NOT art approved',
                         color='white',fontsize=15)
            fig.tight_layout(rect=[0,0,1,.92])
            fig.savefig(out/'genuine_source_three_angle_silhouette.png',dpi=160)
            plt.close(fig)
            receipt['sourceSilhouetteRenderedFromActualMesh']=True
            receipt['status']='SOURCE_ACQUIRED_VALIDATED_PREVIEW_READY_ART_HOLD'
            receipt['artVerdict']='ART_HOLD: authentic preview needs human comparison to existing protected port camera'
            print('STAGE139 SOURCE VERIFIED:',receipt['upstreamSha256'],
                 'triangles',len(geom.faces),'dimensions',receipt['loadedDimensions'])
          except Exception as e:
            receipt.update(status='SOURCE_INTAKE_FAILED_CLOSED',exception=str(e),
                           traceback=traceback.format_exc(limit=4),
                           artVerdict='NO_GO_NOT_INTEGRATED')
            print('STAGE139 SOURCE INTAKE FAILED CLOSED:',repr(e))
          finally:
            (out/'source_licence_geometry_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
            print('STAGE139 DECISION',json.dumps({k:receipt.get(k) for k in
              ('status','source','upstreamSha256','upstreamBytes',
               'triangleCountLoaded','loadedDimensions','sourceSilhouetteRenderedFromActualMesh',
               'artVerdict','productionChanged')}))
          PY
      - name: Upload exact source and preview for visual selection, NEVER Asteria assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-stage139-cc0-helm-source-preview-hold-no-deploy
          path: helm139-source-only/
          if-no-files-found: error
          retention-days: 30
