name: Asteria chair material ray diagnosis (no Blender)

on:
  workflow_dispatch:
  pull_request:
    branches: ['feature/asteria-v5-faithful-pbr']
    paths:
      - 'scripts/asteria_v3_chair_ray_probe.py'
      - '.github/workflows/validate-asteria-chair-ray.yml'

permissions:
  contents: read

jobs:
  ray-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check probe syntax
        run: python -m py_compile scripts/asteria_v3_chair_ray_probe.py
      - name: Install only frozen capture dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0 playwright==1.56.0
      - name: Extract actual V3 mesh into read-only arrays
        run: python scripts/extract_asteria_v3_for_v5.py
      - name: Trace chair camera against source geometry and material IDs
        run: python scripts/asteria_v3_chair_ray_probe.py
      - name: Keep raw intersection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-original-chair-material-probe
          path: _v5_mesh_capture/chair-ray-probe.json
          if-no-files-found: ignore
          retention-days: 7
