name: Validate campaign state

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - campaign/**
      - scripts/validate_campaign.py
      - scripts/create_checkpoint.py
      - .github/workflows/validate-campaign.yml
  push:
    branches:
      - state-engine-v1
      - main
    paths:
      - campaign/**
      - scripts/validate_campaign.py
      - scripts/create_checkpoint.py
      - .github/workflows/validate-campaign.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile state tooling
        run: python -m py_compile scripts/validate_campaign.py scripts/create_checkpoint.py

      - name: Validate canonical candidate snapshot
        run: python scripts/validate_campaign.py

      - name: Prove corrupted state is rejected
        run: |
          tmp="$(mktemp -d)"
          cp -R campaign "$tmp/campaign"
          python - "$tmp/campaign/crew.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          data["backgroundPopulation"]["count"] = 499
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          if python scripts/validate_campaign.py --root "$tmp"; then
            echo "validator incorrectly accepted corrupted crew totals"
            exit 1
          fi
          echo "validator correctly rejected corrupted crew totals"
