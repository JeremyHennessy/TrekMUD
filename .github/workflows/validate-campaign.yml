name: Validate campaign state

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - campaign/**
      - scripts/validate_campaign.py
      - scripts/create_checkpoint.py
      - .github/workflows/validate-campaign.yml
  push:
    branches:
      - state-engine-v1
      - main
    paths:
      - campaign/**
      - scripts/validate_campaign.py
      - scripts/create_checkpoint.py
      - .github/workflows/validate-campaign.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile state tooling
        run: python -m py_compile scripts/validate_campaign.py scripts/create_checkpoint.py

      - name: Validate canonical candidate snapshot
        run: python scripts/validate_campaign.py

      - name: Prove corrupted state is rejected
        run: |
          tmp="$(mktemp -d)"
          cp -R campaign "$tmp/campaign"
          python - "$tmp/campaign/crew.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          data["backgroundPopulation"]["count"] = 499
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          if python scripts/validate_campaign.py --root "$tmp"; then
            echo "validator incorrectly accepted corrupted crew totals"
            exit 1
          fi
          echo "validator correctly rejected corrupted crew totals"

      - name: Prove checkpoint creation is coherent
        run: |
          tmp="$(mktemp -d)"
          cp -R campaign "$tmp/campaign"
          python - "$tmp/campaign" <<'PY'
          import json
          import sys
          from pathlib import Path

          campaign = Path(sys.argv[1])
          state_path = campaign / "state.json"
          state = json.loads(state_path.read_text())
          revision = state["revision"]
          checkpoint_id = f"r{revision:05d}"
          checkpoint_path = campaign / "checkpoints" / f"{checkpoint_id}.json"

          previous_id = None
          if checkpoint_path.exists():
              manifest = json.loads(checkpoint_path.read_text())
              previous_id = manifest.get("previousCheckpointId")
              checkpoint_path.unlink()

          state["checkpoint"] = {
              "lastCheckpointId": previous_id,
              "validated": False,
          }
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n")
          print(f"fixture reset to immediately before {checkpoint_id}")
          PY
          python scripts/create_checkpoint.py --root "$tmp" --summary "CI checkpoint fixture"
          python scripts/validate_campaign.py --root "$tmp"
          python - "$tmp/campaign/state.json" "$tmp/campaign/checkpoints" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = json.loads(Path(sys.argv[1]).read_text())
          revision = state["revision"]
          checkpoint_id = f"r{revision:05d}"
          checkpoint_path = Path(sys.argv[2]) / f"{checkpoint_id}.json"
          checkpoint = json.loads(checkpoint_path.read_text())

          assert state["checkpoint"]["lastCheckpointId"] == checkpoint_id
          assert state["checkpoint"]["validated"] is True
          assert checkpoint["revision"] == revision
          assert checkpoint["validation"]["valid"] is True
          print(f"{checkpoint_id} fixture verified")
          PY
