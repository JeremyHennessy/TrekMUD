name: Bootstrap Jeremy r00001

on:
  push:
    branches:
      - character-jeremy-r00001
    paths:
      - campaign/character-origin.json
      - .github/workflows/bootstrap-r00001.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-r00001
  cancel-in-progress: false

jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-jeremy-r00001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create organic character revision if absent
        run: |
          if [ -f campaign/checkpoints/r00001.json ]; then
            echo "r00001 already exists"
          else
            python scripts/create_character.py --input campaign/character-origin.json
            python scripts/create_checkpoint.py --summary "Jeremy Hennessy organic character creation"
          fi

      - name: Validate canonical candidate
        run: |
          python scripts/validate_campaign.py
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("campaign/state.json").read_text())
          character_doc = json.loads(Path("campaign/character.json").read_text())
          checkpoint = json.loads(Path("campaign/checkpoints/r00001.json").read_text())
          character = character_doc["character"]

          assert state["revision"] == 1
          assert state["rulesVersion"] == "1.1"
          assert state["status"] == "READY_TO_START"
          assert state["player"]["locationId"] == "MER-D09-TR-02"

          assert character["name"] == "Jeremy Hennessy"
          assert character["species"] == "Human"
          assert character["age"] == 30
          assert character["pronouns"] == "he/him"
          assert character["homeworld"] == "Federation starbase upbringing; exact station intentionally unresolved"
          assert character["department"] == "Science"
          assert character["billet"] == "Junior Science Officer"
          assert character["skills"]["Science"] == 2
          assert all(v is None for v in character["attributes"].values())
          assert sorted(character["discoveryState"]["attributePoolRemaining"]) == [1,1,1,2,2]
          assert character["discoveryState"]["academyRank1SlotsRemaining"] == 3
          assert character["primarySpecialty"] is None
          assert character["secondarySpecialty"] is None

          assert checkpoint["checkpointId"] == "r00001"
          assert checkpoint["previousCheckpointId"] == "r00000"
          assert checkpoint["revision"] == 1
          assert checkpoint["rulesVersion"] == "1.1"
          assert checkpoint["validation"]["valid"] is True

          print("Jeremy r00001 verified")
          PY

      - name: Commit generated r00001 if changed
        run: |
          if git diff --quiet -- campaign && [ -z "$(git status --porcelain -- campaign)" ]; then
            echo "No campaign changes."
            exit 0
          fi
          git config user.name "trekmud-character-bot"
          git config user.email "actions@users.noreply.github.com"
          git add campaign
          git commit -m "checkpoint: r00001 Jeremy Hennessy created [skip ci]"
          git push origin HEAD:character-jeremy-r00001
