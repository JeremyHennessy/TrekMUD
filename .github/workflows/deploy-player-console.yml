      - name: Verify the hosted scene actually renders in remote Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==12.3.0
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import shutil
          url='https://jeremyhennessy.github.io/TrekMUD/3d-preview-v5-chair/?studioCapture=aft'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=shutil.which('google-chrome'),
                  args=['--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
                        '--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':1024,'height':720})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto(url,wait_until='domcontentloaded',timeout=60000)
              assert response is not None and response.status==200
              page.wait_for_function(
                  "document.body.dataset.rendererReady === 'true' || document.body.dataset.rendererReady === 'error'",
                  timeout=120000)
              data=page.evaluate("""() => ({
                  ready:document.body.dataset.rendererReady,
                  hero:document.body.dataset.heroChairFaces,
                  removed:document.body.dataset.captainChairFacesRemoved,
                  materials:document.body.dataset.missingMaterials,
                  source:window.__asteriaV5?.sourceV3Sha,
                  frames:document.body.dataset.renderedFrames
              })""")
              print('REMOTE_WEBGL',data,errors,flush=True)
              assert data['ready']=='true' and data['hero']=='31484',data
              assert data['removed']=='16272' and data['materials']=='0',data
              assert data['source']=='74a154ae62bccb0c16d03c2ecf791a64ab19ce81'
              assert int(data['frames'])>=1 and not errors
              page.close()
              # Independently verify the ACTUAL deployed narrow-screen layout.
              from pathlib import Path
              from PIL import Image
              Path('_deployed_qa').mkdir(exist_ok=True)
              for width,height in [(390,844),(375,812)]:
                  phone=browser.new_page(viewport={'width':width,'height':height},has_touch=True)
                  response=phone.goto(url,wait_until='domcontentloaded',timeout=60000)
                  assert response is not None and response.status==200
                  phone.wait_for_function(
                      "document.body.dataset.rendererReady === 'true'",
                      timeout=120000)
                  rect=phone.evaluate("""() => {
                    const a=document.getElementById('topTitle').getBoundingClientRect();
                    const b=document.getElementById('panel').getBoundingClientRect();
                    return {intersection:
                      Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left)) *
                      Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)),
                      titleWidth:a.width, panelLeft:b.left, titleRight:a.right,
                      rendered:document.body.dataset.renderedFrames};
                  }""")
                  assert rect['intersection']==0,(width,rect)
                  assert rect['titleWidth']<=210,(width,rect)
                  filename=f'_deployed_qa/asteria-mobile-{width}x{height}.png'
                  phone.screenshot(path=filename,timeout=90000)
                  with Image.open(filename) as image:
                      assert image.size==(width,height)
                  print('REMOTE_MOBILE_SCREENSHOT_OK',filename,rect,flush=True)
                  phone.close()
              browser.close()
          print('REMOTE_INTERACTIVE_URL_VERIFIED',url,flush=True)
          PY
