          python - <<'PY'
          from pathlib import Path
          import json,shutil
          from PIL import Image,ImageStat
          from playwright.sync_api import sync_playwright

          url='https://jeremyhennessy.github.io/TrekMUD/3d-preview-v5-three-bays/'
          output=Path('_three_bays_deployed_qa')
          output.mkdir(exist_ok=True)
          views=[('aft',1280,800),('bayDetail',960,720),
                 ('bayPanorama',960,720),('aft',390,844)]
