name: Deploy TrekMUD player console

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ui/**
      - campaign/**
      - world/asteria/**
      - scripts/build_player_console.py
      - scripts/build_map_layout.py
      - scripts/validate_player_console.py
      - .github/workflows/deploy-player-console.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trek-player-console-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate canonical campaign state
        run: python scripts/validate_campaign.py

      - name: Validate USS Asteria baseline
        run: |
          python scripts/validate_asteria.py
          python scripts/validate_asteria_crew.py

      - name: Build player-safe console
        run: python scripts/validate_player_console.py --keep _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
