name: Asteria fast-art command camera A/B — isolated draft only
on:
  push:
    branches: [experiment/asteria-stage28-integrated-command-ceiling-sprint]
    paths:
      - scripts/asteria_command_blender.py
      - scripts/asteria_stage32_command_asset.py
      - scripts/asteria_stage33_command_asset.py
      - scripts/asteria_stage33_v3_filter.py
      - scripts/asteria_stage33_contact_ao.py
      - scripts/asteria_stage33_glb_uv1_verify.py
      - scripts/asteria_source_underconsole_audit.py
      - scripts/extract_asteria_v3_for_v5.py
      - baselines/asteria-fast-art-base.json
      - scripts/asteria_fast_art_snapshot.py
      - scripts/test_asteria_fast_art_browser.py
      - .github/workflows/validate-asteria-fast-art.yml
  workflow_dispatch:
    inputs:
      contactAO:
        description: "Expensive Stage33 real Cycles UV1 AO only after visual screening"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: asteria-fast-command-art
  cancel-in-progress: false
jobs:
  visual-trial:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fast-art]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned successful full-gate source snapshot (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("baselines/asteria-fast-art-base.json").read_text())
          assert c["runId"]>0 and len(c["commitSHA"])==40
          assert c["workflow"]=="Asteria Stage28 full structural ceiling macro - real Cycles Chromium A/B NO DEPLOY"
          Path("/tmp/fast-run-id").write_text(str(c["runId"]))
          Path("/tmp/fast-base-sha").write_text(c["commitSHA"])
          PY
          BASE_RUN="$(cat /tmp/fast-run-id)"
          BASE_SHA="$(cat /tmp/fast-base-sha)"
          gh api "repos/JeremyHennessy/TrekMUD/actions/runs/$BASE_RUN"             --jq '{sha: .head_sha, conclusion: .conclusion, name: .name}' > /tmp/fast-run-record.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/fast-run-record.json').read_text())
          assert c['sha']==Path('/tmp/fast-base-sha').read_text()
          assert c['conclusion']=='success'
          assert c['name']=='Asteria Stage28 full structural ceiling macro - real Cycles Chromium A/B NO DEPLOY'
          PY
          gh run download "$BASE_RUN" --repo JeremyHennessy/TrekMUD             --name asteria-fast-art-base --dir _fast-art-base
          python scripts/asteria_fast_art_snapshot.py verify             --root _fast-art-base --base-sha "$BASE_SHA"
      - name: Build only the opt-in command asset with original source-scan maps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --disable-pip-version-check             numpy==2.3.5 Pillow==12.3.0 playwright==1.56.0
          mkdir -p _fast_visual_site/control _fast_visual_site/candidate
          cp -a _fast-art-base/site/. _fast_visual_site/control/
          cp -a _fast-art-base/site/. _fast_visual_site/candidate/
          # Stage33: exact original-source 96 face exclusions independently
          # audited in real Chromium, with original array vs GLB proof.
          python -m py_compile scripts/asteria_stage33_command_asset.py scripts/asteria_stage33_contact_ao.py scripts/asteria_stage33_glb_uv1_verify.py scripts/asteria_command_blender.py
          python scripts/asteria_stage33_command_asset.py > /tmp/stage33-prefight.json
          ASTERIA_V5_SOURCE_DIR=_stage33_original_capture python scripts/extract_asteria_v3_for_v5.py
          python scripts/asteria_source_underconsole_audit.py --output _stage33_original_exact.json
          python scripts/asteria_stage33_v3_filter.py \
            --site _fast-art-base/site --capture _stage33_original_capture \
            --proof _stage33_original_exact.json --out _fast_visual_site/candidate
          mkdir -p _fast_visual_evidence
          mv _fast_visual_site/candidate/stage33-source-exclusion-proof.json \
            _fast_visual_evidence/stage33-source-exclusion-proof.json
          # Candidate flags must be an explicit, reviewed source-code option.
          # Art-first build still bakes command AO; this is NOT final UV1 proof.
          blender -b -t 4 --python-exit-code 1             --python scripts/asteria_command_blender.py --             --materials _fast-art-base/maps --out _fast_command             --samples 20 --no-render --bake-ao --correct-screen-uv --stage33-command-island ${{ inputs.contactAO && '--stage33-contact-ao' || '' }}
          test -s _fast_command/asteria-command-set-candidate.glb
          python scripts/asteria_stage33_glb_uv1_verify.py \
            --glb _fast_command/asteria-command-set-candidate.glb \
            --report _fast_visual_evidence/stage33-exported-contact-uv1-proof.json ${{ inputs.contactAO && '--require-contact-ao' || '' }}
          cp _fast_command/asteria-command-set-candidate.glb             _fast_visual_site/candidate/models/asteria-command-set-candidate.glb
      - name: Actual 1280 desktop and 390 mobile command visuals; zero UI or other GLB changes
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)"             python scripts/test_asteria_fast_art_browser.py               --site _fast_visual_site --out _fast_visual_evidence               --base-sha "$(cat /tmp/fast-base-sha)"
      - name: Preserve evidence even if visuals fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-command-two-camera-fast-art
          path: |
            _fast_visual_evidence/*.png
            _fast_visual_evidence/*.jpg
            _fast_visual_evidence/*.json
            _fast_command/asteria-stage33-real-cycles-contact-uv1.png
            _fast_command/command-report.json
          if-no-files-found: ignore
          retention-days: 30
