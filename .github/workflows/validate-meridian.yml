name: Validate USS Meridian topology

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - world/meridian/**
      - scripts/validate_meridian.py
      - .github/workflows/validate-meridian.yml
  push:
    branches:
      - main
      - meridian-topology-v1
    paths:
      - world/meridian/**
      - scripts/validate_meridian.py
      - .github/workflows/validate-meridian.yml

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile topology validator
        run: python -m py_compile scripts/validate_meridian.py

      - name: Validate candidate graph
        run: python scripts/validate_meridian.py
