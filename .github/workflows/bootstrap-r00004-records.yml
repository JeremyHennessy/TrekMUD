name: Bootstrap career records r00004

on:
  push:
    branches:
      - career-records-v1
    paths:
      - scripts/initialize_career_records.py
      - scripts/validate_campaign.py
      - .github/workflows/bootstrap-r00004-records.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-career-records-r00004
  cancel-in-progress: false

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: career-records-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile state tooling
        run: python -m py_compile scripts/validate_campaign.py scripts/create_checkpoint.py scripts/initialize_career_records.py scripts/apply_player_records.py

      - name: Initialize empty record streams and checkpoint
        run: |
          if [ -f campaign/checkpoints/r00004.json ]; then
            echo "r00004 already exists"
          else
            python scripts/initialize_career_records.py
            python scripts/create_checkpoint.py --summary "Initialize structured player-visible career records"
          fi

      - name: Verify zero-time r00004
        run: |
          python scripts/validate_campaign.py
          python - <<'PY'
          import json
          from pathlib import Path

          state=json.loads(Path("campaign/state.json").read_text())
          records=json.loads(Path("campaign/records.json").read_text())
          rng=json.loads(Path("campaign/rng.json").read_text())
          cp=json.loads(Path("campaign/checkpoints/r00004.json").read_text())

          assert state["revision"] == 4
          assert state["checkpoint"]["lastCheckpointId"] == "r00004"
          assert state["status"] == "READY_TO_START"
          assert state["currentTime"]["shipTime"] == "12:17"
          assert state["currentTime"]["stardate"] == 49317.4
          assert state["player"]["locationId"] == "AST-D09-TR-02"
          assert state["components"]["records"] == "campaign/records.json"

          assert records["revision"] == 4
          assert records["characterId"] == "PC-001"
          assert records["dutyLogs"] == []
          assert records["scienceFindings"] == []
          assert records["missionRecords"] == []
          assert records["relationshipMilestones"] == []
          assert records["shipEvents"] == []

          assert rng["counter"] == 0
          assert cp["checkpointId"] == "r00004"
          assert cp["previousCheckpointId"] == "r00003"
          assert cp["revision"] == 4
          assert cp["validation"]["valid"] is True
          assert cp["validation"]["records"] == 0
          print("career records r00004 verified")
          PY

      - name: Commit generated r00004
        run: |
          if git diff --quiet -- campaign && [ -z "$(git status --porcelain -- campaign)" ]; then
            echo "No campaign changes."
            exit 0
          fi
          git config user.name "trekmud-records-bot"
          git config user.email "actions@users.noreply.github.com"
          git add campaign
          git commit -m "checkpoint: r00004 initialize career records [skip ci]"
          git push origin HEAD:career-records-v1
