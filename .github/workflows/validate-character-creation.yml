name: Validate character creation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - character-creation-v1
      - rules-v1.1-organic-character
    paths:
      - campaign/CHARACTER_CREATION.md
      - campaign/character-template.json
      - scripts/create_character.py
      - tests/fixtures/character-engineering.json
      - .github/workflows/validate-character-creation.yml
  pull_request:
    branches:
      - main
    paths:
      - campaign/CHARACTER_CREATION.md
      - campaign/character-template.json
      - scripts/create_character.py
      - tests/fixtures/character-engineering.json
      - .github/workflows/validate-character-creation.yml

permissions:
  contents: read

jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile character tooling
        run: python -m py_compile scripts/create_character.py

      - name: Validate selection schema
        run: python scripts/create_character.py --input tests/fixtures/character-engineering.json --validate-only

      - name: Prove revision-1 transaction and checkpoint
        if: github.event_name == 'pull_request'
        run: |
          tmp="$(mktemp -d)"
          cp -R campaign "$tmp/campaign"
          python scripts/create_character.py --root "$tmp" --input tests/fixtures/character-engineering.json
          python scripts/create_checkpoint.py --root "$tmp" --summary "CI character creation fixture"
          test -f "$tmp/campaign/checkpoints/r00001.json"
          python scripts/validate_campaign.py --root "$tmp"
          python - "$tmp/campaign/state.json" "$tmp/campaign/character.json" "$tmp/campaign/checkpoints/r00001.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = json.loads(Path(sys.argv[1]).read_text())
          character_doc = json.loads(Path(sys.argv[2]).read_text())
          cp = json.loads(Path(sys.argv[3]).read_text())
          character = character_doc["character"]

          assert state["revision"] == 1
          assert state["rulesVersion"] == "1.1"
          assert state["status"] == "READY_TO_START"
          assert state["player"]["locationId"] == "MER-D09-TR-02"

          assert character["creationMode"] == "ORGANIC_DISCOVERY_V1_1"
          assert all(value is None for value in character["attributes"].values())
          assert sorted(character["discoveryState"]["attributePoolRemaining"]) == [1, 1, 1, 2, 2]
          assert character["skills"]["Engineering"] == 2
          assert sum(value is None for name, value in character["skills"].items() if name != "Engineering") == 12
          assert character["discoveryState"]["academyRank1SlotsRemaining"] == 3
          assert character["primarySpecialty"] is None
          assert character["secondarySpecialty"] is None
          assert character["discoveryState"]["departmentSpecialtyAvailable"] is True
          assert character["discoveryState"]["secondarySpecialtyAvailable"] is True

          assert cp["checkpointId"] == "r00001"
          assert cp["revision"] == 1
          assert cp["rulesVersion"] == "1.1"
          assert cp["previousCheckpointId"] == "r00000"
          assert cp["validation"]["valid"] is True
          print("organic revision-1 fixture checkpoint verified")
          PY
