name: Asteria original flight desk exact geometry proof (read only)
on:
  push:
    branches: [experiment/asteria-stage28-integrated-command-ceiling-sprint]
    paths:
      - scripts/asteria_stage35_flight_source_audit.py
      - .github/workflows/validate-asteria-flight-source.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asteria-flight-source-provenance
  cancel-in-progress: false
jobs:
  exact-forward-desk-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen files and parse new isolated source audit
        run: |
          set -euo pipefail
          python scripts/validate_asteria.py
          python -m py_compile scripts/asteria_stage35_flight_source_audit.py
          test "$(git hash-object ui/3d-preview-v3/index.html)" = 74a154ae62bccb0c16d03c2ecf791a64ab19ce81
          test "$(git hash-object ui/3d-preview-v3/set-details.js)" = 3716accf4490bf28da56be0ae21081ab3a3a0f17
      - name: Execute original frozen V3 in Chromium without runtime writes
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          command -v google-chrome || command -v chromium
          python scripts/asteria_stage35_flight_source_audit.py --output _flight_source_proof/original-flight-desk-ranges.json
      - name: Preserve exact source proof independently
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-stage35-original-flight-desk-provenance
          path: _flight_source_proof/original-flight-desk-ranges.json
          if-no-files-found: ignore
          retention-days: 30
