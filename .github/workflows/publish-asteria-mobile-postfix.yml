name: Preserve deployed Asteria mobile-fix screenshots on QA branch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-asteria-mobile-postfix.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: asteria-qa-gallery-update
  cancel-in-progress: true

jobs:
  publish-mobile-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/asteria-live-visual-audit-20261108
          persist-credentials: true
      - name: Retrieve passing public Pages phone screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42452853528 \
            --repo JeremyHennessy/TrekMUD \
            --name asteria-public-mobile-fixed-actual-screenshots \
            --dir _qa_postfix_mobile
          test -s _qa_postfix_mobile/asteria-public-mobile-fixed-comparison.jpg
      - name: Verify actual post-deploy 3D frames and archive on QA branch only
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('_qa_postfix_mobile')
          report=json.loads((root/'after-deployment.json').read_text())
          assert report['mobileCSSActuallyDeployed'] and report['live3DUnmodified']
          assert len(report['photos'])==2
          for entry in report['photos']:
              assert entry['geometry']['intersection']==0
              assert entry['geometry']['heroFaces']=='31484'
              assert entry['geometry']['removed']=='16272'
              assert entry['geometry']['ready']=='true'
              assert not entry['javascriptErrors']
              assert Image.open(root/entry['screenshot']).size==(entry['width'],entry['height'])
          assert Image.open(root/'asteria-public-mobile-fixed-comparison.jpg').size==(830,900)
          print('Verified both actual post-deploy mobile image captures.')
          PY
          dest=docs/asteria-live-visual-qa-20261108
          mkdir -p "$dest"
          cp _qa_postfix_mobile/asteria-public-mobile-fixed-comparison.jpg "$dest/"
          cp _qa_postfix_mobile/asteria-public-mobile-390x844.png "$dest/"
          cp _qa_postfix_mobile/asteria-public-mobile-375x812.png "$dest/"
          cp _qa_postfix_mobile/after-deployment.json "$dest/"
          cat >> "$dest/README.md" <<'EOF'

          ## Mobile header correction (same live site; subsequent verified deployment)

          The supplementary comparison and two mobile PNGs were captured directly
          from the public GitHub Pages URL in passing verification run 42452853528.
          At both 390×844 and 375×812, the title/minimap intersection measured 0.
          The original V3/V4 URLs and the 31,484-face hero chair were preserved.
          This does not demonstrate physical iPhone GPU performance.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git diff --cached --quiet && exit 0
          git commit -m 'Archive post-deploy mobile Asteria screenshot visual evidence'
          git push origin HEAD:refs/heads/qa/asteria-live-visual-audit-20261108
      - name: Confirm mobile after-screenshot image publicly accessible by HTTPS
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          name='asteria-public-mobile-fixed-comparison.jpg'
          file=Path('docs/asteria-live-visual-qa-20261108')/name
          expected=hashlib.sha256(file.read_bytes()).hexdigest()
          url='https://raw.githubusercontent.com/JeremyHennessy/TrekMUD/qa/asteria-live-visual-audit-20261108/docs/asteria-live-visual-qa-20261108/'+name
          for i in range(15):
              try:
                  with urllib.request.urlopen(url,timeout=30) as resp:
                      assert resp.status==200
                      data=resp.read()
                  assert hashlib.sha256(data).hexdigest()==expected
                  print('POST_DEPLOY_MOBILE_SCREENSHOT_PUBLIC_OK',url,len(data),flush=True)
                  break
              except Exception as e:
                  print('Public image retry',i+1,repr(e),flush=True)
                  if i==14:raise
                  time.sleep(4)
          PY
