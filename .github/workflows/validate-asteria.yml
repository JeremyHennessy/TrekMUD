name: Validate USS Asteria baseline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - world/asteria/**
      - scripts/validate_asteria.py
      - scripts/validate_asteria_crew.py
      - scripts/validate_campaign.py
      - .github/workflows/validate-asteria.yml
  push:
    branches:
      - nebula-asteria-retcon
      - main
    paths:
      - world/asteria/**
      - scripts/validate_asteria.py
      - scripts/validate_asteria_crew.py
      - scripts/validate_campaign.py
      - .github/workflows/validate-asteria.yml

permissions:
  contents: read

jobs:
  asteria:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators
        run: python -m py_compile scripts/validate_asteria.py scripts/validate_asteria_crew.py scripts/validate_campaign.py
      - name: Validate 28-deck topology
        run: python scripts/validate_asteria.py
      - name: Validate 750-person crew model
        run: python scripts/validate_asteria_crew.py
