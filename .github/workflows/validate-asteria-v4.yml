name: Validate USS Asteria V4 cinematic bridge

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'ui/3d-preview-v4/**'
      - 'scripts/build_asteria_v4_assets.py'
      - 'scripts/verify_asteria_v4_assets.py'
      - '.github/workflows/validate-asteria-v4.yml'
      - '.github/workflows/deploy-player-console.yml'
  push:
    branches: ['feature/asteria-v4-cinematic-glb-slice01']
    paths:
      - 'ui/3d-preview-v4/**'
      - 'scripts/build_asteria_v4_assets.py'
      - 'scripts/verify_asteria_v4_assets.py'
      - '.github/workflows/validate-asteria-v4.yml'

permissions:
  contents: read

jobs:
  v4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated 3D build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ui/3d-preview-v4/asset-requirements.txt
          npm ci --prefix ui/3d-preview-v4 --no-audit --no-fund
      - name: Validate unchanged campaign and assemble the existing V3 comparison site
        run: python scripts/validate_player_console.py --keep _site
      - name: Build original authored glTF asset and bundled Three.js viewer
        run: |
          mkdir -p _site/3d-preview-v4/models
          python scripts/build_asteria_v4_assets.py --out _site/3d-preview-v4/models
          npm run build --prefix ui/3d-preview-v4
          cp ui/3d-preview-v4/src/index.html _site/3d-preview-v4/index.html
          cp ui/3d-preview-v4/src/style.css _site/3d-preview-v4/style.css
          cp ui/3d-preview-v4/dist/app.js _site/3d-preview-v4/app.js
          python scripts/verify_asteria_v4_assets.py _site/3d-preview-v4
      - name: Capture actual V4 desktop and mobile WebGL render
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/asteria-v4-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=12000 --dump-dom \
            "http://127.0.0.1:8765/3d-preview-v4/?capture=aft" \
            > "$RUNNER_TEMP/asteria-v4-dom.html" 2> "$RUNNER_TEMP/asteria-v4-chrome.log"
          # Always capture an initial image before any assertions, so renderer
          # failures can be diagnosed visually instead of hiding useful evidence.
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=12000 --window-size=1024,720 \
            --screenshot="$RUNNER_TEMP/asteria-v4-diagnostic.png" \
            "http://127.0.0.1:8765/3d-preview-v4/?capture=aft" \
            2>> "$RUNNER_TEMP/asteria-v4-chrome.log"
          # Chrome virtual time may snapshot the DOM between asynchronous GLB
          # completion and the next RAF. Validate loaded scene and actual pixels
          # rather than trusting a RAF counter as evidence of a rendered image.
          grep -q 'data-scene="loaded"' "$RUNNER_TEMP/asteria-v4-dom.html"
          grep -q 'data-glb-meshes=' "$RUNNER_TEMP/asteria-v4-dom.html"
          python - <<'PY_IMAGE'
          from PIL import Image, ImageStat
          import os
          img=Image.open(os.environ['RUNNER_TEMP']+'/asteria-v4-diagnostic.png').convert('RGB')
          stdev=ImageStat.Stat(img).stddev
          assert max(stdev)>20, f'diagnostic screenshot has insufficient visual content: {stdev}'
          print({'diagnostic_visual_spread':stdev})
          PY_IMAGE
          grep -q 'data-missing-material="0"' "$RUNNER_TEMP/asteria-v4-dom.html"
          for VIEW in aft command flight viewer; do
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl \
              --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
              --virtual-time-budget=10000 --window-size=1440,900 \
              --screenshot="$RUNNER_TEMP/asteria-v4-${VIEW}.png" \
              "http://127.0.0.1:8765/3d-preview-v4/?capture=${VIEW}" \
              2>> "$RUNNER_TEMP/asteria-v4-chrome.log"
            test -s "$RUNNER_TEMP/asteria-v4-${VIEW}.png"
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=11000 --window-size=390,844 \
            --screenshot="$RUNNER_TEMP/asteria-v4-mobile.png" \
            "http://127.0.0.1:8765/3d-preview-v4/?capture=aft" \
            2>> "$RUNNER_TEMP/asteria-v4-chrome.log"
          test -s "$RUNNER_TEMP/asteria-v4-mobile.png"
          # Comparative baseline: same bridge, same camera, previous renderer.
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl \
            --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=5500 --window-size=1440,900 \
            --screenshot="$RUNNER_TEMP/asteria-v3-aft.png" \
            "http://127.0.0.1:8765/3d-preview-v3/?studioCapture=aft" \
            2>> "$RUNNER_TEMP/asteria-v4-chrome.log"
          # A plain browser 404 screenshot is small; reject missing V3 comparisons.
          test "$(stat -c%s "$RUNNER_TEMP/asteria-v3-aft.png")" -gt 100000
      - name: Verify first-person keyboard movement and station navigation
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python scripts/test_asteria_v4_browser.py _site
      - name: Archive render and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-v4-cinematic-review
          path: |
            ${{ runner.temp }}/asteria-v4-*.png
            ${{ runner.temp }}/asteria-v3-aft.png
            ${{ runner.temp }}/asteria-v4-dom.html
            ${{ runner.temp }}/asteria-v4-chrome.log
            ${{ runner.temp }}/asteria-v4-server.log
            ui/3d-preview-v4/package-lock.json
            _site/3d-preview-v4/app.js
          if-no-files-found: ignore
          retention-days: 7