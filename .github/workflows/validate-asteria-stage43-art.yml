name: Asteria Stage43 port monocoque — genuine Chromium desktop mobile A/B NO DEPLOY
on:
  push:
    branches: [experiment/asteria-stage28-integrated-command-ceiling-sprint]
    paths:
      - scripts/asteria_stage43_command_blender.py
      - scripts/asteria_stage43_verify.py
      - scripts/asteria_stage43_sculpt.json
      - .github/workflows/validate-asteria-stage43-art.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: asteria-stage43-single-foreground-art
  cancel-in-progress: false
jobs:
  art-first-swiftshader:
    if: contains(github.event.head_commit.message, '[stage43-art]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SHA-pinned original world and art materials (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          c=json.load(open('baselines/asteria-fast-art-base.json'))
          assert (c['runId'],c['commitSHA'])==(42749695563,'e8b3c3db6a482d2c6a9f66589307f9ae582961ed')
          PY
          gh api repos/JeremyHennessy/TrekMUD/actions/runs/42749695563 \
            --jq '{sha:.head_sha,conclusion:.conclusion,name:.name}' >/tmp/stage43-pinned.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/stage43-pinned.json'))
          assert c['sha']=='e8b3c3db6a482d2c6a9f66589307f9ae582961ed'
          assert c['conclusion']=='success'
          assert c['name']=='Asteria Stage28 full structural ceiling macro - real Cycles Chromium A/B NO DEPLOY'
          PY
          gh run download 42749695563 --repo JeremyHennessy/TrekMUD \
            --name asteria-fast-art-base --dir _stage43_pinned
          python scripts/asteria_fast_art_snapshot.py verify \
            --root _stage43_pinned --base-sha e8b3c3db6a482d2c6a9f66589307f9ae582961ed
      - name: Offline sculpt source and exact preserved original control geometry
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 Pillow==12.3.0 playwright==1.56.0
          python -m py_compile scripts/asteria_stage43_command_blender.py scripts/asteria_stage43_verify.py
          mkdir -p _stage43_site/control _stage43_site/candidate _stage43_evidence
          cp -a _stage43_pinned/site/. _stage43_site/control/
          cp -a _stage43_pinned/site/. _stage43_site/candidate/
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_stage43_command_blender.py -- \
            --out _stage43_command --materials _stage43_pinned/maps \
            --samples 20 --no-render --bake-ao --correct-screen-uv
          python scripts/asteria_stage43_verify.py \
            --base _stage43_site/control/models/asteria-command-set-candidate.glb \
            --candidate _stage43_command/asteria-command-set-candidate.glb \
            --out _stage43_evidence/retained-source-controls-proof.json
          cp _stage43_command/asteria-command-set-candidate.glb \
            _stage43_site/candidate/models/asteria-command-set-candidate.glb
          cp _stage43_command/stage43-art-trial.json _stage43_evidence/
          cp _stage43_command/command-report.json _stage43_evidence/
      - name: Real unchanged-camera desktop and mobile browser images
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium)" \
            python scripts/test_asteria_fast_art_browser.py \
              --site _stage43_site --out _stage43_evidence \
              --base-sha e8b3c3db6a482d2c6a9f66589307f9ae582961ed
      - name: Preserve all visual proof; no deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-stage43-port-workstation-art-first
          path: |
            _stage43_evidence/*.png
            _stage43_evidence/*.jpg
            _stage43_evidence/*.json
            _stage43_command/asteria-command-set-candidate.blend
          if-no-files-found: ignore
          retention-days: 30
