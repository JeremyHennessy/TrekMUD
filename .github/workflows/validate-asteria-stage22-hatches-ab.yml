name: Asteria Stage22 formed sealed hatch replacement - source-exact Blender Cycles Chromium A/B NO DEPLOY

on:
  push:
    branches: [experiment/asteria-stage22-formed-hatches-ab]
    paths:
      - scripts/asteria_stage22_hatch_blender.py
      - scripts/asteria_stage22_furnished_cycles.py
      - scripts/test_asteria_stage22_hatches_browser.py
      - scripts/build_asteria_v5_assets.py
      - scripts/extract_asteria_v3_for_v5.py
      - .github/workflows/validate-asteria-stage22-hatches-ab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asteria-stage22-formed-hatches-a-b
  cancel-in-progress: false

jobs:
  real-browser-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect frozen V3, player, and unchanged default geometry
        run: |
          python scripts/validate_campaign.py
          python scripts/validate_asteria.py
          test "$(git hash-object ui/3d-preview-v3/index.html)" = 74a154ae62bccb0c16d03c2ecf791a64ab19ce81
          python -m py_compile scripts/test_asteria_roof_rail_ab.py \
            scripts/asteria_envelope_blender.py scripts/asteria_envelope_scanned_pbr.py \
            scripts/build_asteria_v5_assets.py scripts/extract_asteria_v3_for_v5.py \
            scripts/asteria_stage22_hatch_blender.py scripts/asteria_stage22_furnished_cycles.py \
            scripts/test_asteria_stage22_hatches_browser.py
      - name: Install known good three.js, original V3, actual Chromium and Blender runtime
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1 playwright==1.56.0
          npm ci --prefix ui/3d-preview-v5 --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y blender
          command -v google-chrome || command -v chromium
      - name: Capture immutable all original source-face boundaries, in memory only
        run: |
          ASTERIA_V3_CAPTURE_CAPTAIN_CHAIR=1 \
            ASTERIA_V3_CAPTURE_COMMAND_SECTION=1 \
            ASTERIA_V3_CAPTURE_INLAID_BAY=1 \
            ASTERIA_V3_CAPTURE_THREE_RIB_BAYS=1 \
            ASTERIA_V3_CAPTURE_ENVELOPE=1 \
            ASTERIA_V3_CAPTURE_SIDE_HATCHES=1 \
            python scripts/extract_asteria_v3_for_v5.py
      - name: Create byte-identical three-bay control and optional wall/ceiling source-exact variant
        run: |
          set -euo pipefail
          mkdir -p _site/3d-preview-v5-command-three-bays/models
          ASTERIA_V5_EXCLUDE_CAPTAIN_CHAIR=1 \
            ASTERIA_V5_EXCLUDE_COMMAND_SECTION=1 \
            ASTERIA_V5_EXCLUDE_THREE_RIB_BAYS=1 \
            ASTERIA_V5_OUT_DIR="$PWD/_site/3d-preview-v5-command-three-bays/models" \
            python scripts/build_asteria_v5_assets.py
          cp ui/3d-preview-v5-command/src/index.html \
             _site/3d-preview-v5-command-three-bays/index.html
          mkdir -p _site/3d-preview-v5-command-envelope
          cp -a _site/3d-preview-v5-command-three-bays/. \
             _site/3d-preview-v5-command-envelope/
          ASTERIA_V5_EXCLUDE_CAPTAIN_CHAIR=1 \
            ASTERIA_V5_EXCLUDE_COMMAND_SECTION=1 \
            ASTERIA_V5_EXCLUDE_THREE_RIB_BAYS=1 \
            ASTERIA_V5_EXCLUDE_ENVELOPE=1 \
            ASTERIA_V5_OUT_DIR="$PWD/_site/3d-preview-v5-command-envelope/models" \
            python scripts/build_asteria_v5_assets.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site')
          a=json.loads((p/'3d-preview-v5-command-three-bays/models/manifest.json').read_text())
          b=json.loads((p/'3d-preview-v5-command-envelope/models/manifest.json').read_text())
          assert a['triangles']==81914 and b['triangles']==81050
          assert 'envelope_source_faces_removed' not in a
          assert b['envelope_source_faces_removed']==864
          assert [row['faces'] for row in b['envelope_source_ranges']]==[672,192]
          assert a['three_rib_bays_source_faces_removed']==b['three_rib_bays_source_faces_removed']==174
          assert a['captain_chair_source_faces_removed']==b['captain_chair_source_faces_removed']==16272
          assert a['command_section_source_faces_removed']==b['command_section_source_faces_removed']==8628
          assert a['source_git_blob']==b['source_git_blob']=='74a154ae62bccb0c16d03c2ecf791a64ab19ce81'
          print('EXACT_FULL_ARCHITECTURAL_ENVELOPE_864_REMOVED_SOURCE_FACES')
          PY
      - name: Build proven same chair, command and original triple-fin decoration once
        run: |
          python scripts/asteria_fetch_cc0_velour.py --out _cc0_chair
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_hero_chair_blender.py -- \
            --out _stage08_chair --texture-dir _cc0_chair \
            --samples 24 --no-render --integrated-back
          python scripts/asteria_command_pbr_maps.py \
            --out _command_maps --v3-atlas _v5_mesh_capture/atlas.png
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_command_blender.py -- \
            --materials _command_maps --out _stage08_command \
            --samples 24 --no-render --bake-ao --correct-screen-uv
          python scripts/asteria_rib_fin_maps.py --out _rib_fin_maps
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_three_rib_bays_blender.py -- \
            --out _stage08_threebays --materials _rib_fin_maps \
            --command-materials _command_maps \
            --source-report _v5_mesh_capture/three-rib-bays-source-spans.json \
            --samples 20 --no-render
          for route in 3d-preview-v5-command-three-bays 3d-preview-v5-command-envelope; do
            root="_site/$route/models"
            cp _stage08_chair/asteria-hero-chair-candidate.glb "$root/"
            cp _stage08_command/asteria-command-set-candidate.glb "$root/"
            cp _stage08_threebays/asteria-three-original-pitch-rib-bays-04.glb "$root/"
          done
      - name: Build whole-room scanned CC0 envelope with corrected local-ray Cycles AO
        run: |
          python scripts/asteria_envelope_scanned_pbr.py \
            --out _envelope_scanned_maps
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_envelope_blender.py -- \
            --out _stage08_envelope \
            --materials _envelope_scanned_maps \
            --command-materials _command_maps \
            --source-report _v5_mesh_capture/envelope-source-spans.json \
            --samples 20 --resolution 960 640 --bake-ao \
            --omit-radial-rails
          cp _stage08_envelope/asteria-realistic-architectural-envelope-08.glb \
            _site/3d-preview-v5-command-envelope/models/
          python - <<'PY'
          from pathlib import Path
          import json,struct,trimesh,numpy as np
          from PIL import Image
          p=Path('_stage08_envelope')
          scene=trimesh.load(p/'asteria-realistic-architectural-envelope-08.glb',
                             force='scene',process=False)
          tri=sum(len(mesh.faces) for mesh in scene.geometry.values())
          glb=(p/'asteria-realistic-architectural-envelope-08.glb').read_bytes()
          data=json.loads(glb[20:20+struct.unpack_from('<I',glb,12)[0]])
          aos=[m for m in data['materials'] if m.get('occlusionTexture',{}).get('texCoord')==1]
          assert 1000<tri<50000
          assert len(aos)>=2
          assert len(data.get('images',[]))>=12
          results={}
          for name in ('wall','ceiling'):
            pixels=np.asarray(Image.open(p/f'asteria-envelope-{name}-real-cycles-ao.png').convert('RGB'))[:,:,0]
            mean=float(pixels.mean());std=float(pixels.std())
            assert mean>145,(name,mean,'Cannot publish nearly black AO')
            assert std>2,(name,std,'Cannot fake AO with solid white')
            results[name]={'mean':mean,'std':std,'minimum':int(pixels.min())}
          report=json.loads((p/'architectural-report.json').read_text())
          assert report['meshObjects']==30 and report['radialRailsEmitted']==0,report
          proof={'newEnvelopeTriangles':tri,'meshObjects':30,'sourceRemovedFaces':864,
                 'pbrImages':len(data['images']),'aoMaterialCount':len(aos),
                 'realCyclesAORanges':results,'ownerVisualApproval':False}
          path=Path('_site/3d-preview-v5-command-envelope/models/envelope-manifest.json')
          path.write_text(json.dumps(proof,indent=2)+'\n')
          print('WHOLE_ROOM_SCANNED_AO_ENVELOPE',json.dumps(proof))
          PY
      - name: Build source exact Stage22 side-hatch candidate (24O original faces excluded, never main)
        run: |
          set -euo pipefail
          mkdir -p _site/3d-preview-v5-command-envelope-hatches
          cp -a _site/3d-preview-v5-command-envelope/. \
            _site/3d-preview-v5-command-envelope-hatches/
          ASTERIA_V5_EXCLUDE_CAPTAIN_CHAIR=1 \
          ASTERIA_V5_EXCLUDE_COMMAND_SECTION=1 \
          ASTERIA_V5_EXCLUDE_THREE_RIB_BAYS=1 \
          ASTERIA_V5_EXCLUDE_ENVELOPE=1 \
          ASTERIA_V5_EXCLUDE_SIDE_HATCHES=1 \
          ASTERIA_V5_OUT_DIR="$PWD/_site/3d-preview-v5-command-envelope-hatches/models" \
            python scripts/build_asteria_v5_assets.py
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_stage22_hatch_blender.py -- \
            --out _stage22_hatch --architectural-materials _envelope_scanned_maps \
            --command-materials _command_maps \
            --source-report _v5_mesh_capture/side-hatches-source-spans.json \
            --no-render
          cp _stage22_hatch/asteria-stage22-formed-side-hatches.glb \
             _site/3d-preview-v5-command-envelope-hatches/models/
          python - <<'PY'
          from pathlib import Path
          import json,struct,trimesh
          b=Path('_site/3d-preview-v5-command-envelope/models')
          c=Path('_site/3d-preview-v5-command-envelope-hatches/models')
          old=json.loads((b/'manifest.json').read_text())
          new=json.loads((c/'manifest.json').read_text())
          assert old['triangles']==81050 and new['triangles']==80810,(old['triangles'],new['triangles'])
          assert new['side_hatches_source_faces_removed']==240
          assert [(r['start'],r['end']) for r in new['side_hatches_source_ranges']]==[
            (92830,92950),(92950,93070)]
          for name in ('asteria-hero-chair-candidate.glb','asteria-command-set-candidate.glb',
               'asteria-three-original-pitch-rib-bays-04.glb',
               'asteria-realistic-architectural-envelope-08.glb'):
            assert (b/name).read_bytes()==(c/name).read_bytes(),name
          f=c/'asteria-stage22-formed-side-hatches.glb'
          data=f.read_bytes();assert data[:4]==b'glTF'
          n,typ=struct.unpack_from('<I4s',data,12)
          assert typ==b'JSON'
          gltf=json.loads(data[20:20+n])
          meshes=gltf['meshes']
          report=json.loads(Path('_stage22_hatch/stage22-hatch-report.json').read_text())
          assert len(meshes)>=80 and report['meshCount']>=80
          assert len(gltf['materials'])>=5 and len(gltf['images'])>=12
          assert any('normalTexture' in m for m in gltf['materials'])
          assert all('TEXCOORD_0' in p['attributes'] for m in meshes for p in m['primitives'])
          scene=trimesh.load(f,force='scene',process=False)
          triangles=sum(len(g.faces) for g in scene.geometry.values())
          assert triangles>2000 and triangles<120000,triangles
          Path('_stage22_hatch/stage22-manifest-integrity.json').write_text(json.dumps({
            'meshCount':len(meshes),'triangles':triangles,
            'materials':len(gltf['materials']),'images':len(gltf['images']),
            'sourceV3TrianglesRemoved':240,'originalV3TrianglesLeft':80810,
            'allSharedGLBsByteIdentical':True,'noMainOrCampaignChanges':True},indent=2))
          print('STAGE22_TWO_REAL_FORMED_HATCHES_GLB_PASS',triangles,len(meshes))
          PY
      - name: Assemble both same-source original command/three-bay user interfaces with hidden QA cameras
        run: |
          set -euo pipefail
          cp ui/3d-preview-v5-command/src/main.js \
            ui/3d-preview-v5/src/__stage08_control_source.js
          python - <<'PY'
          from pathlib import Path
          p=Path('ui/3d-preview-v5/src/__stage08_control_source.js')
          s=p.read_text()
          views='  const views={'
          assert s.count(views)==1
          s=s.replace(views,views+
             "\n    envelopeWall:{x:-2.6,z:-.5,yaw:-1.18,label:'QA WHOLE WALL ONLY'},"
             "\n    envelopeCeiling:{x:-2.32,z:2.15,yaw:.22,label:'QA CEILING ONLY'},")
          anchor="Object.assign(pos,{x:p.x,z:p.z,yaw:p.yaw,pitch:-.14});active=name;"
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+
             "if(name==='envelopeCeiling')pos.pitch=.58;")
          original='triangles!==106988-removed-commandRemoved||missing'
          assert s.count(original)==1
          s=s.replace(original,
             'triangles!==106988-removed-commandRemoved-174||'+
             'meta.threeRibBaysRemovedFaces!==174||'+
             '(meta.threeRibBaysSourceRanges||[]).length!==3||missing')
          anchor='    scene.add(room,hero,command);'
          assert s.count(anchor)==1
          triple="""    scene.add(room,hero,command);
             loader.loadAsync('./models/asteria-three-original-pitch-rib-bays-04.glb')
               .then(({scene:triple})=>{
                 let faces=0,meshes=0,missing=0;
                 triple.traverse(o=>{
                   if(!o.isMesh)return;
                   meshes++;
                   faces+=o.geometry.index?o.geometry.index.count/3:
                             o.geometry.attributes.position.count/3;
                   if(!o.material)missing++;
                   else o.material.side=THREE.DoubleSide;
                   o.castShadow=!mobile;
                   o.receiveShadow=true;
                 });
                 if(faces!==13098||meshes!==105||missing){
                   fail('Frozen V3 three-bay source set is invalid');return;
                 }
                 scene.add(triple);
                 document.body.dataset.threeBayFaces=String(faces);
                 document.body.dataset.threeBayMeshes=String(meshes);
                 document.body.dataset.threeBayLoaded='true';
                 window.__asteriaThreeBayReview={excludedOriginalFaces:174,
                     noGameWrites:true};
               }).catch(e=>fail('QA original three-bay model failed: '+String(e.message||e)));
          """
          s=s.replace(anchor,triple)
          assert s.count("threeBayLoaded")==1
          p.write_text(s)
          PY
          ui/3d-preview-v5/node_modules/.bin/esbuild \
            ui/3d-preview-v5/src/__stage08_control_source.js \
            --bundle --platform=browser --target=es2021 --format=iife --minify \
            --outfile=_site/3d-preview-v5-command-three-bays/app.js
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('_site/3d-preview-v5-command-envelope/models')
          report=json.loads((root/'envelope-manifest.json').read_text())
          expected=report['newEnvelopeTriangles']
          s=Path('ui/3d-preview-v5/src/__stage08_control_source.js').read_text()
          anchor='triangles!==106988-removed-commandRemoved-174||'
          assert s.count(anchor)==1
          s=s.replace(anchor,
            'triangles!==106988-removed-commandRemoved-174-864||'+
            'meta.envelopeRemovedFaces!==864||'+
            '(meta.envelopeSourceRanges||[]).length!==2||')
          anchor='    scene.add(room,hero,command);'
          assert s.count(anchor)==1
          extra="""    scene.add(room,hero,command);
          loader.loadAsync('./models/asteria-realistic-architectural-envelope-08.glb')
            .then(({scene:architecture})=>{
               let faces=0,meshes=0,missing=0,ao=0;
               architecture.traverse(o=>{
                 if(!o.isMesh)return;
                 meshes++;
                 faces+=o.geometry.index?o.geometry.index.count/3:
                           o.geometry.attributes.position.count/3;
                 if(!o.material)missing++;
                 if(o.material?.aoMap)ao++;
                 if(o.material)o.material.side=THREE.DoubleSide;
                 o.receiveShadow=true;
                 o.castShadow=false;
               });
               if(faces!==EXPECTED_ARCH_FACES||meshes!==30||missing||ao<2){
                 fail('Scanned architectural envelope failed geometry, PBR or UV1 AO verification');return;
               }
               scene.add(architecture);
               document.body.dataset.envelopeFaces=String(faces);
               document.body.dataset.envelopeMeshes=String(meshes);
               document.body.dataset.envelopeAOMaterials=String(ao);
               document.body.dataset.envelopeOriginalRemoved='864';
               document.body.dataset.envelopeLoaded='true';
               window.__asteriaEnvelopeReview={originalRemoved:864,
                    bakedCyclesAO:true,photographicPBR:true,
                    originalPlayerUnchanged:true,notArtApproved:true};
            }).catch(e=>fail('Scanned architectural envelope failed to load: '+String(e.message||e)));
          """
          extra=extra.replace("EXPECTED_ARCH_FACES",str(expected))
          s=s.replace(anchor,extra)
          assert s.count("envelopeLoaded")==1
          Path('ui/3d-preview-v5/src/__stage08_candidate_source.js').write_text(s)
          PY
          ui/3d-preview-v5/node_modules/.bin/esbuild \
            ui/3d-preview-v5/src/__stage08_candidate_source.js \
            --bundle --platform=browser --target=es2021 --format=iife --minify \
            --outfile=_site/3d-preview-v5-command-envelope/app.js
          cp ui/3d-preview-v5/src/__stage08_candidate_source.js _stage22_envelope_review_source.js
          rm ui/3d-preview-v5/src/__stage08_control_source.js \
             ui/3d-preview-v5/src/__stage08_candidate_source.js
      - name: Assemble isolated optional Stage22 route from EXACT Stage12 review source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          source=Path('_stage22_envelope_review_source.js').read_text()
          anchor='triangles!==106988-removed-commandRemoved-174-864||'
          assert source.count(anchor)==1
          source=source.replace(anchor,
              'triangles!==106988-removed-commandRemoved-174-864-240||'+
              'meta.sideHatchesRemovedFaces!==240||'+
              '(meta.sideHatchesSourceRanges||[]).length!==2||')
          path=Path('_stage22_hatch/stage22-hatch-report.json')
          report=json.loads(path.read_text())
          assert report['replacedOriginalSourceFaces']==240 and report['meshCount']>=80
          anchor="     scene.add(architecture);"
          assert source.count(anchor)==1
          extra="""               scene.add(architecture);
               loader.loadAsync('./models/asteria-stage22-formed-side-hatches.glb')
                 .then(({scene:hatches})=>{
                   let faces=0,meshes=0,missing=0,normal=0;
                   hatches.traverse(o=>{
                     if(!o.isMesh)return;
                     meshes++;
                     faces+=o.geometry.index?o.geometry.index.count/3:
                                   o.geometry.attributes.position.count/3;
                     if(!o.material)missing++;
                     if(o.material?.normalMap)normal++;
                     if(o.material)o.material.side=THREE.DoubleSide;
                     o.receiveShadow=true;
                     o.castShadow=!mobile;
                   });
                   if(meshes!==EXPECTED_HATCH_MESHES||faces<2000||faces>120000||missing||normal<20){
                     fail('Two manufactured hatches failed real GLB geometry/scan material proof');return;
                   }
                   scene.add(hatches);
                   document.body.dataset.hatchFaces=String(faces);
                   document.body.dataset.hatchMeshes=String(meshes);
                   document.body.dataset.hatchOriginalRemoved='240';
                   document.body.dataset.hatchLoaded='true';
                   window.__asteriaHatchReview={originalV3RemovedFaces:240,
                     replacedBothOriginalAuthoredHatches:true,noGameOrUiWrites:true,
                     artApproved:false};
                 }).catch(err=>fail('Stage22 replacement hatches did not load: '+String(err.message||err)));
          """.replace("EXPECTED_HATCH_MESHES",str(report['meshCount']))
          source=source.replace(anchor,extra)
          assert source.count('hatchLoaded')==1
          Path('_stage22_hatch_candidate_source.js').write_text(source)
          PY
          ui/3d-preview-v5/node_modules/.bin/esbuild \
            _stage22_hatch_candidate_source.js --bundle --platform=browser \
            --target=es2021 --format=iife --minify \
            --outfile=_site/3d-preview-v5-command-envelope-hatches/app.js
          test -s _site/3d-preview-v5-command-envelope-hatches/app.js
      - name: Independently prove the chair, command, original fins and UI are byte-identical
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import trimesh
          root=Path('_site')
          control=root/'3d-preview-v5-command-three-bays'
          candidate=root/'3d-preview-v5-command-envelope'
          assert (control/'index.html').read_bytes()==(candidate/'index.html').read_bytes()
          for file in ('asteria-hero-chair-candidate.glb',
                       'asteria-command-set-candidate.glb',
                       'asteria-three-original-pitch-rib-bays-04.glb'):
            assert (control/'models'/file).read_bytes()==(candidate/'models'/file).read_bytes(),file
          assert (control/'app.js').read_bytes()!=(candidate/'app.js').read_bytes()
          faces=lambda p:sum(len(g.faces) for g in trimesh.load(p,force='scene',process=False).geometry.values())
          assert faces(control/'models/asteria-v3-restored-pbr.glb')==81914
          assert faces(candidate/'models/asteria-v3-restored-pbr.glb')==81050
          assert faces(control/'models/asteria-hero-chair-candidate.glb')==31484
          assert faces(control/'models/asteria-command-set-candidate.glb')==16292
          assert faces(control/'models/asteria-three-original-pitch-rib-bays-04.glb')==13098
          print('ENVELOPE_QA_PROTECTED_APP_MODELS_EQUAL')
          PY
      - name: Verify 14 real baseline-vs-source-exact valid UV1 full-scene screenshots and walking
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)" \
            python scripts/test_asteria_roof_rail_ab.py _site _stage08_browser
      - name: Genuine fully furnished source-exact Stage12 versus formed-hatch Cycles A/B
        run: |
          set -euo pipefail
          blender -b -t 4 --python-exit-code 1 \
            --python scripts/asteria_stage22_furnished_cycles.py -- \
            --base-site _site/3d-preview-v5-command-envelope/models \
            --candidate-site _site/3d-preview-v5-command-envelope-hatches/models \
            --out _stage22_cycles --samples 28 --resolution 1000 640
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_stage22_cycles/stage22-real-furnished-cycles-report.json').read_text())
          assert r['renderCount']==4 and r['stage22HatchMeshes']>=80
          for mode in ('baseline','formedHatches'):
            for view in ('wall','aft'):
              f=Path(f'_stage22_cycles/stage22-real-furnished-{mode}-{view}.png')
              assert f.is_file() and f.stat().st_size>15000,f
          print('STAGE22_FURNISHED_GENUINE_CYCLES_FOUR_PNG_PASS')
          PY
      - name: Real desktop and mobile Chromium software-WebGL Stage22 full-scene A/B
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)" \
            python scripts/test_asteria_stage22_hatches_browser.py _site _stage22_browser
